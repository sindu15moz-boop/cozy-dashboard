<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Detcho Calculator</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #ffffff; color: #000; overflow-x: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 8px; }
  .calc { width: 100%; max-width: 360px; background: #fff; border-radius: 18px; padding: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); display: flex; flex-direction: column; gap: 8px; }
  .display { background: #eaf2fb; border-radius: 12px; padding: 10px 14px; min-height: 82px; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; overflow: hidden; }
  .expression { font-size: 13px; color: #6b7a8f; text-align: right; min-height: 18px; white-space: nowrap; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
  .expression::-webkit-scrollbar { display: none; }
  .result { font-size: 26px; font-weight: 600; color: #000; text-align: right; white-space: nowrap; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; line-height: 1.1; }
  .result::-webkit-scrollbar { display: none; }
  .mode-row { display: flex; gap: 6px; justify-content: flex-end; }
  .mode-btn { padding: 4px 12px; font-size: 11px; font-weight: 700; letter-spacing: 1px; border: 1px solid #cfe0f3; background: #fff; color: #000; border-radius: 8px; cursor: pointer; transition: all 0.15s ease; }
  .mode-btn.active { background: #a9cdf5; border-color: #a9cdf5; }
  .mode-btn:active { transform: scale(0.95); }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .btn { border: none; border-radius: 10px; background: #d6e7fa; color: #000; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; transition: transform 0.08s ease, background 0.15s ease; box-shadow: 0 1px 2px rgba(0,0,0,0.08); user-select: none; font-size: 15px; aspect-ratio: 1 / 1; min-height: 0; }
  .btn:active { transform: scale(0.94); background: #b9d6f2; box-shadow: none; }
  .btn.num { font-size: 17px; font-weight: 600; }
  .btn.op  { background: #c2dcf7; font-size: 17px; font-weight: 600; }
  .btn.fn  { font-size: 12px; }
  .btn.eq  { background: #a9cdf5; font-weight: 700; font-size: 18px; }
  .btn.ac  { background: #f5d6d6; font-weight: 700; font-size: 13px; }
  .signature { margin-top: 22px; font-family: "Brush Script MT", "Segoe Script", cursive; font-size: 30px; font-style: italic; color: #000; text-align: center; letter-spacing: 1px; opacity: 0.85; }
  @media (max-width: 360px) { .btn { font-size: 13px; } .btn.num, .btn.op { font-size: 15px; } .btn.fn { font-size: 10px; } .btn.eq { font-size: 16px; } .result { font-size: 22px; } .signature { font-size: 26px; } }
</style>
</head>
<body>
<div class="calc">
  <div class="display">
    <div class="expression" id="expression"></div>
    <div class="result" id="result">0</div>
  </div>
  <div class="mode-row">
    <button class="mode-btn active" id="degBtn">DEG</button>
    <button class="mode-btn" id="radBtn">RAD</button>
  </div>
  <div class="grid" id="grid">
    <button class="btn fn" data-fn="sin">sin</button>
    <button class="btn fn" data-fn="cos">cos</button>
    <button class="btn fn" data-fn="tan">tan</button>
    <button class="btn fn" data-fn="log">log</button>
    <button class="btn fn" data-fn="ln">ln</button>
    <button class="btn fn" data-fn="sq">x²</button>
    <button class="btn fn" data-fn="pow">xʸ</button>
    <button class="btn fn" data-fn="sqrt">√</button>
    <button class="btn fn" data-fn="inv">1/x</button>
    <button class="btn fn" data-fn="pi">π</button>
    <button class="btn fn" data-fn="e">e</button>
    <button class="btn ac" data-ac>AC</button>
    <button class="btn fn" data-del>DEL</button>
    <button class="btn op" data-op="(">(</button>
    <button class="btn op" data-op=")">)</button>
    <button class="btn num" data-num="7">7</button>
    <button class="btn num" data-num="8">8</button>
    <button class="btn num" data-num="9">9</button>
    <button class="btn op" data-op="÷">÷</button>
    <button class="btn op" data-op="%">%</button>
    <button class="btn num" data-num="4">4</button>
    <button class="btn num" data-num="5">5</button>
    <button class="btn num" data-num="6">6</button>
    <button class="btn op" data-op="×">×</button>
    <button class="btn op" data-op="−">−</button>
    <button class="btn num" data-num="1">1</button>
    <button class="btn num" data-num="2">2</button>
    <button class="btn num" data-num="3">3</button>
    <button class="btn op" data-op="+">+</button>
    <button class="btn eq" data-eq>=</button>
    <button class="btn num" data-num="0" style="grid-column: span 2;">0</button>
    <button class="btn num" data-num=".">.</button>
    <button class="btn fn" data-fn="neg">±</button>
    <button class="btn fn" data-fn="ans">Ans</button>
  </div>
</div>
<div class="signature">Detcho</div>
<script src="script.js"></script>
</body>
</html>
